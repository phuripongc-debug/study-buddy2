<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Buddy</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    padding:20px;
}

nav{
    background:white;
    padding:15px;
    display:flex;
    gap:10px;
}

button{
    padding:12px 18px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

main{
    padding:25px;
}

.box{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}

input{
    padding:10px;
    margin:5px;
}

.item{
    padding:10px;
    margin-top:10px;
    background:#eef2ff;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>Study Buddy</h1>
<p>ระบบช่วยจัดการห้องเรียน</p>
</header>

<nav>
<button onclick="showPage('schedule')">📚 ตารางเรียน</button>
<button onclick="showPage('assignment')">📝 งานที่ต้องส่ง</button>
<button onclick="showPage('exam')">📄 ตารางสอบ</button>
</nav>

<main>

<div id="content" class="box">

<h2>ยินดีต้อนรับ 👋</h2>
<p>เลือกเมนูด้านบนเพื่อเริ่มใช้งาน</p>

</div>

</main>

<script>

function showPage(page){

let content=document.getElementById("content");

if(page==="schedule"){

content.innerHTML=`
<h2>📚 ตารางเรียน</h2>

<input id="subject" placeholder="ชื่อวิชา">
<input id="time" placeholder="เวลา">

<button onclick="addSchedule()">เพิ่ม</button>

<div id="list"></div>
`;

}

else if(page==="assignment"){

content.innerHTML=`
<h2>📝 งานที่ต้องส่ง</h2>

<input id="work" placeholder="ชื่องาน">

<button onclick="addWork()">เพิ่ม</button>

<div id="list"></div>
`;

}

else if(page==="exam"){

content.innerHTML=`
<h2>📄 ตารางสอบ</h2>

<input id="exam" placeholder="ชื่อวิชา">

<button onclick="addExam()">เพิ่ม</button>

<div id="list"></div>
`;

}

}


function addSchedule(){

let subject=document.getElementById("subject").value;
let time=document.getElementById("time").value;

if(subject==="") return;

document.getElementById("list").innerHTML+=
`<div class="item">
📚 ${subject} | ${time}
</div>`;

}


function addWork(){

let work=document.getElementById("work").value;

if(work==="") return;

document.getElementById("list").innerHTML+=
`<div class="item">
📝 ${work}
</div>`;

}


function addExam(){

let exam=document.getElementById("exam").value;

if(exam==="") return;

document.getElementById("list").innerHTML+=
`<div class="item">
📄 ${exam}
</div>`;

}

</script>

</body>
</html>
